<title>寄付ギフト UIプロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --text:#232323; --text2:#555; --muted:#888; --line:#E5E5E5; --line2:#EDEDED;
  --page:#F6F6F6; --white:#FFFFFF; --panel:#F8F8F8;
  --navy:#2C5B84; --navy-dark:#1F4666; --blue-light:#E3EFF7; --blue-link:#4A8BC2;
  --orange:#F26B3C; --orange-soft:#FDF1EC; --green:#3A8F5A; --green-soft:#E6F3EA; --red:#C94A3A;
  --bar:#8FB3D3; --bar2:#D6E3EE;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --text:#ECECEC; --text2:#C8C8C8; --muted:#9A9A9A; --line:#3A3A3A; --line2:#303030;
    --page:#161616; --white:#222222; --panel:#1C1C1C;
    --navy:#6E9ECB; --navy-dark:#8FB8DE; --blue-light:#1E2F3E; --blue-link:#7FB2E0;
    --orange:#F58A62; --orange-soft:#33251F; --green:#6BBE88; --green-soft:#1D3325; --red:#E07A6C;
    --bar:#4E7598; --bar2:#2B3A47;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --text:#ECECEC; --text2:#C8C8C8; --muted:#9A9A9A; --line:#3A3A3A; --line2:#303030;
  --page:#161616; --white:#222222; --panel:#1C1C1C;
  --navy:#6E9ECB; --navy-dark:#8FB8DE; --blue-light:#1E2F3E; --blue-link:#7FB2E0;
  --orange:#F58A62; --orange-soft:#33251F; --green:#6BBE88; --green-soft:#1D3325; --red:#E07A6C;
  --bar:#4E7598; --bar2:#2B3A47;
  --shadow:0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--text);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--white);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{width:100%;min-height:84px;resize:vertical}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{background:var(--white);border-bottom:1px solid var(--line2);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.topbar .in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:-.3px;white-space:nowrap}
.logo .ast{color:var(--orange);font-weight:400}
.logo small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--text2);font-size:13px;font-weight:500;padding:7px 12px;border-radius:20px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue-light);color:var(--navy);font-weight:700}
.case{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.note{background:var(--blue-light);color:var(--text2);font-size:12px;padding:6px 16px;text-align:center}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}

/* common parts */
.card{background:var(--white);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 0}
.card .hd h3{margin:0;font-size:14px;font-weight:700}
.card .bd{padding:12px 18px 16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:20px;padding:2px 9px;border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.pill.daily::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.btn{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--blue-link);cursor:pointer;padding:0;font-size:13px}
.up{color:var(--green)} .down{color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.sel td{background:var(--blue-light)}
table.t tr.click{cursor:pointer}
.r{text-align:right}
.scroll{overflow-x:auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.g21{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g21{grid-template-columns:1fr}}
.kpi{padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--text2);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.kpi .d{font-size:12px;margin-top:2px}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:10px;background:var(--bar2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--bar);border-radius:5px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:20px;margin:0;line-height:1.35}
.pagehead .sub{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.toggle button{border:0;background:var(--white);padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text2)}
.toggle button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* voices */
.voice{border-bottom:1px solid var(--line2);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.voice:last-child{border-bottom:0}
.voice .av{width:34px;height:34px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.voice .tx{flex:1;min-width:0}
.voice .tx p{margin:0 0 4px}
.voice .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voice.new{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--orange-soft)}100%{background:transparent}}
.like{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:2px 10px;font-size:12px;cursor:pointer}
.like[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
.hiddenv{opacity:.45}

/* muni layout */
.mlayout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.mlayout{grid-template-columns:1fr}}
.snav{background:var(--white);border:1px solid var(--line2);border-radius:10px;padding:8px;position:sticky;top:76px}
.snav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2)}
.snav button[aria-current="page"]{background:var(--blue-light);color:var(--navy);font-weight:700}
.snav .sep{border-top:1px solid var(--line2);margin:8px 4px}
.snav .cap{font-size:11px;color:var(--muted);padding:4px 12px}
.funnel{display:flex;gap:6px;align-items:stretch}
.funnel .st{flex:1;background:var(--panel);border-radius:8px;padding:10px 12px;min-width:0}
.funnel .st b{display:block;font-size:18px}
.funnel .st span{font-size:11px;color:var(--muted)}
.fbar{height:6px;background:var(--bar2);border-radius:3px;margin-top:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--navy)}

/* settings */
.qrow{display:grid;grid-template-columns:28px minmax(0,1fr) 120px 80px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
@media (max-width:700px){.qrow{grid-template-columns:28px minmax(0,1fr);}}
.lock{font-size:11px;color:var(--muted)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:11px;cursor:pointer;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--navy)}
.switch input:checked+span::after{left:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;font-size:13px}
.subtabs button[aria-pressed="true"]{color:var(--navy);border-color:var(--navy);font-weight:700}

/* report */
.doc{background:var(--white);border:1px solid var(--line);border-radius:4px;padding:36px 40px;max-width:760px;margin:0 auto;box-shadow:var(--shadow)}
.doc h2{font-size:18px;margin:0 0 4px}
.doc h4{font-size:13px;margin:20px 0 6px;border-left:3px solid var(--navy);padding-left:8px}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px}
.doc td,.doc th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.doc th{background:var(--panel);font-weight:500}
@media (max-width:700px){.doc{padding:20px}}

/* phone */
.phonewrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
@media (max-width:900px){.phonewrap{grid-template-columns:1fr}}
.explain h2{font-size:20px;margin:0 0 8px;line-height:1.4}
.explain p,.explain li{color:var(--text2)}
.phone{width:375px;max-width:100%;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.ph-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:700}
.ph-head .bk{border:0;background:none;font-size:18px;cursor:pointer;padding:0 4px 0 0}
.ph-body{min-height:600px;padding:16px}
.ph-steps{display:flex;gap:4px;margin-bottom:14px}
.ph-steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.ph-steps i.on{background:var(--orange)}
.gcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--white);width:100%;text-align:left}
.gcard .ic{width:44px;height:44px;border-radius:8px;background:var(--blue-light);display:grid;place-items:center;font-size:20px;flex:none}
.gcard .nm{font-weight:700;font-size:13px}
.gcard .sm{font-size:11px;color:var(--muted)}
.gcard .left{margin-left:auto;font-size:12px;color:var(--navy);font-weight:700;white-space:nowrap}
.sponsor{background:var(--orange-soft);border-radius:10px;padding:12px;margin:4px 0 14px;font-size:12px}
.sponsor b{color:var(--orange)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:18px;padding:6px 12px;font-size:12px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft);color:var(--orange);font-weight:700}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 0;font-size:12px;cursor:pointer}
.stars button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.qr{width:180px;height:180px;margin:10px auto;display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:10px;background:#fff;border:1px solid #ddd;border-radius:8px}
.qr i{background:#222;border-radius:1px}
.qr i.w{background:#fff}
.bigbtn{display:block;width:100%;border:0;border-radius:24px;padding:12px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;font-size:14px;margin-top:12px}
.bigbtn.sub{background:var(--white);color:var(--text);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--page);padding:10px 18px;border-radius:24px;font-size:13px;box-shadow:var(--shadow);z-index:50;max-width:calc(100% - 32px)}
.share{max-width:720px;margin:0 auto}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
</style>

const fmt = n => n.toLocaleString('ja-JP');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function delta(cur, prev){ if(!prev) return '<span class="muted">比較なし</span>'; const d=Math.round((cur-prev)/prev*1000)/10; return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d)}%</span>`; }
function hbars(rows, opts={}){ const max=Math.max(...rows.map(r=>r[1]),1); const tot=rows.reduce((a,r)=>a+r[1],0);
  return rows.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span class="r num">${opts.pct?pct(v,tot)+'%':fmt(v)}</span></div>`).join(''); }
function spark(cur, prev){ const w=560,h=150,px=34,py=14; const all=[...cur,...prev]; const mx=Math.max(...all,1);
  const X=i=>px+i*(w-px-10)/(cur.length-1), Y=v=>h-py-(v/mx)*(h-py*2-8);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const months=['4月','5月','6月','7月','8月','9月'];
  const ticks=[0,Math.round(mx/2),mx];
  return `<svg viewBox="0 0 ${w} ${h+18}" role="img" aria-label="月別の利用数">
    ${ticks.map(t=>`<line x1="${px}" x2="${w-10}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line2)"/><text x="${px-6}" y="${Y(t)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${fmt(t)}</text>`).join('')}
    <path d="${path(prev)}" fill="none" stroke="var(--bar)" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="${path(cur)}" fill="none" stroke="var(--navy)" stroke-width="2.5"/>
    ${cur.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--navy)"/>`).join('')}
    ${months.map((m,i)=>`<text x="${X(i)}" y="${h+12}" font-size="10" text-anchor="middle" fill="var(--muted)">${m}</text>`).join('')}

  return `<div class="pagehead"><div><h1>報告書の作成</h1><div class="sub">直接の結果と初期成果は自動で入る。背景・考察・次年度の欄は担当課が書く</div></div>

  <div class="doc">
    <div class="small muted">${isMid?'中間報告（2026年9月末時点）':'期末報告（2027年3月末）'}　／　${esc(c.muni)}</div>

    <div class="small muted">${esc(d.name)} 様</div>

    <h4>ハイライト</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${tile(fmt(p.used)+(kids?' 世帯':' 件'),'利用（消し込み）')}

      ${tile(notw+'%',kids?'なければ利用しなかった':'なければ来なかった')}
      ${tile(top2+'%','満足・やや満足')}
    </div>

    <h4>1. 事業の概要</h4>
    <table>
      <tr><th style="width:26%">事業の目標</th><td>${esc(p.goal)}</td></tr>
      <tr><th>対象</th><td>${kids?'保育園等に在籍していない3歳未満の子の保護者、多子世帯':'さっぽろ圏11市町村を訪れる旅行者（旅先納税の寄附者）'}</td></tr>
      <tr><th>期間</th><td>${esc(p.period)}</td></tr>
      <tr><th>事業費と寄附</th><td>事業費 ${yen(p.budget)}のうち、貴社の寄附 ${yen(d.amount)}（${sharePct}%）</td></tr>
      <tr><th>背景となる地域の課題</th><td class="muted">（担当課が記入）${kids?'例：市内の3歳未満児のうち保育園等に通っていない子の割合、子育ての孤立感に関する市民調査の結果など':'例：圏域の観光入込客数の推移、札幌市以外への周遊の少なさなど'}</td></tr>
    </table>

    <h4>2. 評価の考え方（ロジックモデル）</h4>

    <h4>3. 直接の結果</h4>
    <table><tr><th>配布</th><th>受取率</th><th>利用率</th><th>${p.tour!=null?'周遊率':'2回以上の利用'}</th><th>アンケート回答率</th></tr>
      <tr class="num"><td>${fmt(p.issued)} ${c.unitLabel}</td><td>${pct(p.received,p.issued)}%</td><td>${pct(p.used,p.received)}%</td><td>${Math.round((p.tour??p.repeat)*100)}%</td><td>${respRate}%</td></tr></table>
    <div class="chart" style="margin-top:10px">${spark(p.trend,p.trendPrev)}<div class="legend"><span><i style="background:var(--navy)"></i>今年度の月別利用</span><span><i style="background:var(--bar)"></i>前年度</span></div></div>
    <div class="grid g21" style="margin-top:8px">${Object.entries(p.breakdown).slice(0,2).map(([k,rows])=>`<div><div class="small" style="font-weight:700;margin-bottom:2px">${esc(k)}</div>${hbars(rows,{pct:true})}</div>`).join('')}</div>

    <h4>4. 初期成果</h4>
    <table><tr><th>成果</th><th>値</th><th>計算</th><th>データ</th></tr>${outcomes.map(o=>`<tr><td>${o[0]}</td><td class="num" style="white-space:nowrap"><b>${o[1]}</b></td><td class="small">${o[2]}</td><td class="small">${o[3]}</td></tr>`).join('')}</table>
    <p class="small" style="margin:8px 0 0">事業がなくても起きた分（デッドウェイト）：「${kids?'クーポンがなくても利用した':'ギフトがなくても来た'}」${dead}%、「たぶん${kids?'利用した':'来た'}」${maybe}%。上の成果の値は、この分を差し引いた「${kids?'利用しなかった':'来なかった'}」の回答だけを使っている。</p>

    <h4>5. 貴社の寄附がもたらしたもの</h4>
    <table>
      <tr><th style="width:40%">貴社の寄附の割合</th><td class="num">事業費の ${sharePct}%</td></tr>
      <tr><th>割合に応じた利用</th><td class="num">${fmt(Math.round(p.used*share))} ${kids?'世帯':'件'}</td></tr>
      <tr><th>割合に応じた初期成果</th><td class="num">${kids?`初めてサービスを使った ${fmt(Math.round(firstN*share))} 世帯`:`ギフトがなければ来なかった ${fmt(Math.round(addN*share))} 件`}</td></tr>
      <tr><th>利用1${kids?'世帯':'件'}あたりの寄附</th><td class="num">約${fmt(Math.round(d.amount/(p.used*share)/100)*100)}円</td></tr>
      <tr><th>社内への広がり</th><td class="num">社内共有ページを見た社員 ${fmt(c.corp.viewed)}人（${pct(c.corp.viewed,c.corp.employees)}%）、声への共感 ${fmt(vs.reduce((a,v)=>a+v.likes,0))}件</td></tr>
    </table>
    <p class="small muted" style="margin:6px 0 0">寄附は事業全体の財源に入るため、貴社分は寄附の割合で按分して示している。</p>

    <h4>6. 受け取った人の声</h4>
    ${Object.entries(themes).map(([th,list])=>`<div style="margin-top:8px"><div class="small" style="font-weight:700">${esc(th)}（${list.length}件）</div>${list.slice(0,2).map(v=>`<p style="margin:4px 0">「${esc(v.t)}」<span class="small muted">（${esc(v.a)}）</span></p>`).join('')}</div>`).join('')}
    <p class="small muted" style="margin:6px 0 0">公開に同意した ${fmt(vs.length)}件から、テーマ別に抜粋。</p>

    <h4>7. 評価の方法と限界</h4>
    <ul class="small" style="margin:0;padding-left:18px">
      <li>直接の結果は、ギフトの消し込み記録（全数）から集計。</li>
      <li>初期成果は、利用後アンケート（回答率 ${respRate}%）と消し込み記録を掛け合わせて算出。回答した人に偏りがありうる。</li>
      <li>${kids?'利用の前倒しや、他の支援で代わりに利用した分':'ほかの旅行予定からの振り替え（ディスプレースメント）'}は、アンケートだけでは測れないため含めていない。</li>
      <li>中期・長期成果（${kids?'育児負担・孤立感の軽減':'観光入込客数・観光消費額'}）は、この報告書の範囲外。</li>
    </ul>

    <h4>8. 考察と次年度に向けて</h4>
    <textarea id="repNote" aria-label="考察と次年度に向けて" placeholder="（担当課が記入）例：利用の少ない地区への周知、事業者の追加、次年度の目標値など">${esc(note)}</textarea>

    <h4>9. 開示用の要約（統合報告書・サステナビリティレポート向け）</h4>
    <div style="background:var(--panel);border-radius:6px;padding:10px 12px;font-size:13px">${esc(disclose)}</div>
    <div class="small muted" style="margin-top:4px">そのまま貼れる形。GRI 413（地域コミュニティ）の取り組みの記載に使える。</div>

    <h4>付録</h4>
    <ul class="small" style="margin:0;padding-left:18px">
      <li>アンケートの設問：${c.questions.map(q=>esc(q.text)).join('／')}</li>
      <li>指標の定義：受取率＝受け取った数÷配布数、利用率＝利用数÷受け取った数、満足度＝5段階のうち上位2つの割合</li>
      <li>評価の考え方の出典：内閣府「ロジック・モデル作成のポイント」、SIMI「社会的インパクト評価ツールセット 子育て支援」、観光庁「DMOのKGI・KPI計測の手引書」、慶應SFC「SROI実施ガイドライン」</li>
    </ul>
  </div>`;
}

  } else if(S.setTab==='reg'){
    inner = `<p class="small muted" style="margin-top:0">利用登録の必須項目。効果の計算（何世帯・何人に届いたか、係数）に使います。年齢は区分で持ち、企業には集計値しか出ません。</p>
      ${c.reg.map(r=>`<div class="row"><span><b>${esc(r.label)}</b><br><span class="small muted">${r.opts.map(esc).join(' / ')}</span></span><span class="pill">必須</span></div>`).join('')}

function corpData(){ const c=C(); const p=c.projects[0]; return {c,p}; }
function renderCorp(){
  const {c,p}=corpData(); const cp=c.corp; const sh=S.corpShow;
  const myAmt=c.donors.filter(d=>d.name===cp.name).reduce((a,d)=>a+d.amount,0);
  const cur = S.cmp==='month'?p.thisMonthUsed:p.used, prev=S.cmp==='month'?p.prevMonthUsed:p.prevYearUsed;
  const reach=pct(cp.viewed,cp.employees);
  const cards=[
    ['amount','寄附額（自社）',yen(myAmt),'<span class="muted">今年度</span>'],
    ['households','届いた'+(c.kind==='子育て'?'世帯':'件数'),fmt(p.received),delta(p.received, Math.round(p.received*0.92))],
    ['userate','利用率',pct(p.used,p.received)+'%',delta(cur,prev)],
    ['reach','波及率（社内）',reach+'%',`<span class="muted">${fmt(cp.viewed)}／${fmt(cp.employees)}人</span>`]

  ${sh.cards&&cards.length?`<div class="grid g4">${cards.map(k=>`<div class="card kpi"><div class="lb"><span>${k[1]}</span><span class="pill live">リアルタイム</span></div><div class="v num">${k[2]}</div><div class="d">${k[3]}</div></div>`).join('')}</div>`:''}

      ${vs.length?vs.map((v,i)=>`<div class="voice ${S.flash===v?'new':''}"><div class="av">声</div><div class="tx"><p>${esc(v.t)}</p><div class="meta"><span>${esc(v.a)}</span><span>${esc(v.ago)}</span><button class="like" data-act="like" data-i="${c.voices.indexOf(v)}" aria-pressed="${!!v.liked}">共感 ${v.likes}</button></div></div></div>`).join(''):'<div class="small muted">まだ声がありません</div>'}
    </div></div>`:''}
    <div class="grid" style="align-content:start">
      ${sh.places?`<div class="card"><div class="hd"><h3>使われた場所（${esc(placeKey.replace('別',''))}）</h3><span class="pill daily">1日1回更新・本日6:00</span></div><div class="bd">${hbars(place,{pct:true})}<div class="small muted" style="margin-top:6px">10件未満の区分は「その他」。店ごとの地図は出しません。</div></div></div>`:''}
      ${sh.places&&kindKey?`<div class="card"><div class="hd"><h3>よく使われた${c.kind==='子育て'?'サービス':'業種'}</h3><span class="pill daily">1日1回更新</span></div><div class="bd">${hbars(p.breakdown[kindKey],{pct:true})}</div></div>`:''}
      ${sh.report?`<div class="card"><div class="hd"><h3>報告書</h3></div><div class="bd">
        <div class="row"><span>中間報告（2026年9月末時点）<br><span class="small muted">初期成果・声の抜粋を含む</span></span><button class="btn" data-act="openReport">見る</button></div>
        <div class="row"><span>期末報告（2027年3月末）</span><span class="pill">2027年4月予定</span></div></div></div>`:''}
    </div>

}

  $('#caseSel').value=S.caseId;
  $('#app').innerHTML = {phone:renderPhone, muni:renderMuni, corp:renderCorp, share:renderShare}[S.role]();
  const bd=$('#bdSel'); if(bd) bd.onchange=e=>{S.bdKey=e.target.value; render();};
  const rd=$('#repDonor'); if(rd) rd.onchange=e=>{S.reportDonor=+e.target.value; render();};
  const rn=$('#repNote'); if(rn) rn.oninput=e=>{S.reportNote[S.caseId+S.reportDonor+S.reportKind]=e.target.value;};
  const tm=$('#tmpl'); if(tm) tm.onchange=e=>{ if(!e.target.value) return; const qs=C().questions; qs.splice(qs.length-1,0,{id:'c'+Date.now(),text:e.target.value.replace(/（SIMI）/,''),type:'choice',opts:['はい','いいえ'],share:true}); toast('ひな形から設問を追加しました'); render(); };
  S.flash=null;
}
document.getElementById('roles').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.role=b.dataset.role; if(S.role==='share') C().corp.viewed++; render(); window.scrollTo(0,0); });
document.getElementById('caseSel').addEventListener('change', e=>{ S.caseId=e.target.value; S.phoneStep=0; S.reg={}; S.answers={}; S.muniProject=null; S.bdKey=null; S.reportDonor=0; render(); });
document.getElementById('app').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; const c=C();
  if(a==='reg'){ S.reg[b.dataset.k]=b.dataset.v; }
  else if(a==='pnext'){ if(Object.keys(S.reg).length<c.reg.length) return; S.phoneStep=1; }
  else if(a==='pback'){ S.phoneStep=Math.max(0,S.phoneStep-1); }
  else if(a==='pick'){ S.phoneStep=2; }
  else if(a==='redeem'){ const p=c.projects[0]; p.used++; p.thisMonthUsed++; p.trend[p.trend.length-1]++; S.useCount=(S.useCount||0)+1; S.phoneStep=3; toast('消し込みました。自治体と企業の利用数が1増えました'); }
  else if(a==='ans'){ S.answers[b.dataset.q]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v; }
  else if(a==='ansm'){ const q=b.dataset.q; const arr=S.answers[q]||[]; S.answers[q]=arr.includes(b.dataset.v)?arr.filter(x=>x!==b.dataset.v):[...arr,b.dataset.v]; }
  else if(a==='submit'){
    const msgQ=c.questions.find(q=>q.type==='text'); const t=msgQ?($('#q_'+msgQ.id)?.value||'').trim():''; const pub=$('#pub')?.checked;
    c.questions.forEach(q=>{ const v=S.answers[q.id]; const ag=c.agg[q.id]; if(v==null||!ag) return;
      if(q.type==='scale'){ ag[v-1]++; } else if(q.type==='choice'){ const i=q.opts.indexOf(v); if(i>=0) ag[i]=(ag[i]||0)+1; } else if(q.type==='multi'){ v.forEach(o=>ag[o]=(ag[o]||0)+1); } });
    if(t && pub){ const attr = S.caseId==='matsumoto' ? `${S.reg[2]||''}・${S.reg[3]||''}地区` : `${S.reg[2]||''}・${S.reg[1]||''}`; const v={t, a:attr, ago:'たった今', likes:0}; c.voices.unshift(v); S.flash=v; }
    S.phoneStep=4; toast(t&&pub?'ひとことが企業の画面に届きました':'回答を送信しました'); }
  else if(a==='goCorp'){ S.role='corp'; }
  else if(a==='prestart'){ S.phoneStep=1; S.answers={}; }
  else if(a==='mpage'){ S.muniPage=b.dataset.p; }
  else if(a==='mproj'){ S.muniProject=b.dataset.id; S.bdKey=null; }
  else if(a==='cmp'){ S.cmp=b.dataset.v; }
  else if(a==='hide'){ const v=c.voices[+b.dataset.i]; v.hidden=!v.hidden; toast(v.hidden?'企業の画面から非表示にしました':'企業の画面に戻しました'); }
  else if(a==='rkind'){ S.reportKind=b.dataset.v; }
  else if(a==='export'){ toast(`${b.dataset.v}で書き出し（プロトタイプのため未実装）`); return; }
  else if(a==='stab'){ S.setTab=b.dataset.v; }
  else if(a==='qdel'){ c.questions.splice(+b.dataset.i,1); toast('設問を削除しました。スマホのアンケートに反映されます'); }
  else if(a==='qadd'){ c.questions.splice(c.questions.length-1,0,{id:'c'+Date.now(),text:'新しい設問',type:'choice',opts:['はい','いいえ'],share:true}); }
  else if(a==='cshow'){ S.corpShow[b.dataset.k]=b.checked; toast(b.checked?'企業の画面に表示します':'企業の画面から外しました'); return; }
  else if(a==='qshare'){ c.questions[+b.dataset.i].share=b.checked; return; }
  else if(a==='like'){ const v=c.voices[+b.dataset.i]; v.liked=!v.liked; v.likes+=v.liked?1:-1; }
  else if(a==='goShare'){ S.role='share'; c.corp.viewed++; window.scrollTo(0,0); }
  else if(a==='openReport'){ S.role='muni'; S.muniPage='report'; S.reportKind='mid'; const i=c.donors.findIndex(d=>d.name===c.corp.name); S.reportDonor=i<0?0:i; window.scrollTo(0,0); }
  else if(a==='stub'){ toast('プロトタイプのため未実装'); return; }
  else return;
  render();
});
document.getElementById('app').addEventListener('change', e=>{
  const t=e.target; const c=C();
  if(t.dataset.act==='qtext'){ c.questions[+t.dataset.i].text=t.value; }
  if(t.dataset.act==='qtype'){ const q=c.questions[+t.dataset.i]; q.type=t.value; if((q.type==='choice'||q.type==='multi')&&!q.opts) q.opts=['はい','いいえ']; render(); }
});
render();
</script>
